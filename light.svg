<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Adarsh B A - Premium Developer Profile Hero Banner (Light Mode)">
  <defs>
    <!-- Light Theme Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF6FF"/>
    </linearGradient>

    <!-- Light Glassmorphism Surface Gradients -->
    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="chromeHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Accent Gradient (Blue -> Cyan -> Emerald) -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>

    <!-- Filters for Depth -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Typography Hierarchy -->
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      .name-text { font-size: 30px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
      .section-head { font-size: 11px; font-weight: 700; fill: #0284C7; letter-spacing: 1.5px; }
      .muted { font-size: 13px; fill: #475569; }
      .bright { font-size: 13px; font-weight: 600; fill: #0F172A; }
      .label-col { font-size: 12px; font-weight: 700; fill: #0284C7; text-anchor: end; }
      .val-col { font-size: 13px; fill: #1E293B; }
      
      .ascii-art { font-size: 10px; fill: #059669; font-weight: 700; line-height: 1.15; }
      .ascii-dim { fill: #10B981; opacity: 0.75; }
      .ascii-bright { fill: #047857; }
    </style>
  </defs>

  <!-- 1. CANVAS FRAME (Outer Container) -->
  <rect x="8" y="8" width="1164" height="594" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="8" y="8" width="1164" height="594" rx="22" fill="url(#grid)"/>

  <!-- Background Soft Radial Orbs -->
  <circle cx="180" cy="140" r="160" fill="#2563EB" opacity="0.06" filter="url(#glow)"/>
  <circle cx="980" cy="460" r="200" fill="#10B981" opacity="0.06" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="140" fill="#06B6D4" opacity="0.05" filter="url(#glow)"/>

  <!-- 2. TOP TERMINAL EDITOR CHROME -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.05s" dur="0.4s" fill="freeze"/>
    <rect x="24" y="24" width="1132" height="38" rx="10" fill="url(#chromeHeader)" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Terminal Buttons -->
    <circle cx="46" cy="43" r="5.5" fill="#FF5F56"/>
    <circle cx="64" cy="43" r="5.5" fill="#FFBD2E"/>
    <circle cx="82" cy="43" r="5.5" fill="#27C93F"/>
    
    <text x="108" y="47" class="mono muted" font-size="12">developer@profile:~ <tspan fill="#64748B">[ zsh ]</tspan></text>
    
    <!-- Top Nav Tabs (Decorative) -->
    <text x="500" y="47" class="mono muted" font-size="11">Code &nbsp;&nbsp; Projects &nbsp;&nbsp; Architecture &nbsp;&nbsp; Contact</text>

    <!-- Status Indicator -->
    <rect x="1024" y="33" width="116" height="20" rx="10" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.4"/>
    <circle cx="1037" cy="43" r="3.5" fill="#059669">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1047" y="47" class="mono" font-size="10" font-weight="700" fill="#059669">SYS.ONLINE</text>
  </g>

  <!-- ================= 3. LEFT PANEL — VISUAL / IDENTITY (420px / 38% width) ================= -->
  <g transform="translate(24, 76)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.15s" dur="0.5s" fill="freeze"/>

    <!-- Left Glass Panel Container -->
    <rect x="0" y="0" width="430" height="508" rx="16" fill="url(#glassPanel)" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="430" height="508" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Left Panel Header -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 414 0 A 16 16 0 0 1 430 16 L 430 38 L 0 38 Z" fill="#F1F5F9" fill-opacity="0.8"/>
    <text x="16" y="24" class="mono section-head">VISUAL.MAP // PORTRAIT</text>
    <line x1="0" y1="38" x2="430" y2="38" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Centered ASCII Portrait Canvas Frame -->
    <rect x="25" y="54" width="380" height="340" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="25" y="54" width="380" height="340" rx="12" fill="none" stroke="#059669" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- SMIL Scanline Animation -->
    <line x1="25" y1="56" x2="405" y2="56" stroke="#059669" stroke-width="1.5" opacity="0.5" filter="url(#glow)">
      <animate attributeName="y1" values="56;390;56" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="56;390;56" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- Dense Monospace ASCII Character Representation (Centered inside frame) -->
    <g transform="translate(42, 70)" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.6s" fill="freeze"/>
      <text class="mono ascii-art">
        <tspan x="0" dy="0" class="ascii-dim">   . : + * # % @ @ @ @ % # * + : .   </tspan>
        <tspan x="0" dy="12" class="ascii-dim">  : + # % @ @ @ @ @ @ @ @ % # + :  </tspan>
        <tspan x="0" dy="12"> + # % @ @ @ <tspan class="ascii-bright">SYSTEM.ARCH</tspan> @ @ % # + </tspan>
        <tspan x="0" dy="12"> # % @ @ <tspan class="ascii-bright">┌──────────────────┐</tspan> @ @ % # </tspan>
        <tspan x="0" dy="12"> % @ @   <tspan class="ascii-bright">│  ADARSH  B  A    │</tspan>   @ @ % </tspan>
        <tspan x="0" dy="12"> @ @ @   <tspan class="ascii-bright">│  FOUNDER &amp; CEO   │</tspan>   @ @ @ </tspan>
        <tspan x="0" dy="12"> @ @ @   <tspan class="ascii-bright">└──────────────────┘</tspan>   @ @ @ </tspan>
        <tspan x="0" dy="12"> % @ @ % # * + : . : + * # % @ @ % </tspan>
        <tspan x="0" dy="12" class="ascii-dim"> # % @ # + : .     . : + # % @ # </tspan>
        <tspan x="0" dy="12" class="ascii-dim"> + # % + :             : + % # + </tspan>
        <tspan x="0" dy="12"> : + # :   <tspan class="ascii-bright">┌───────────────┐</tspan>   : # + : </tspan>
        <tspan x="0" dy="12"> . : + .   <tspan class="ascii-bright">│ ROOTNODE      │</tspan>   . + : . </tspan>
        <tspan x="0" dy="12">   . : .   <tspan class="ascii-bright">│ REBELS        │</tspan>   . : .   </tspan>
        <tspan x="0" dy="12" class="ascii-dim">     .     <tspan class="ascii-bright">└───────────────┘</tspan>     .     </tspan>
        <tspan x="0" dy="12" class="ascii-dim"> . : + * # % @ @ @ @ % # * + : .   </tspan>
        <tspan x="0" dy="12" class="ascii-dim">  : + # % @ @ @ @ @ @ @ @ % # + :  </tspan>
        <tspan x="0" dy="12" class="ascii-dim">   . : + * # % @ @ @ @ % # * + : .   </tspan>
        <tspan x="0" dy="12" class="ascii-dim">     . : + * # % @ % # * + : .       </tspan>
        <tspan x="0" dy="12">       . : + * # % # * + : .         </tspan>
        <tspan x="0" dy="12" class="ascii-bright">         + * # % % # * +             </tspan>
        <tspan x="0" dy="12" class="ascii-bright">           # % @ @ % #               </tspan>
        <tspan x="0" dy="12" class="ascii-bright">             % @ @ %                 </tspan>
        <tspan x="0" dy="12" class="ascii-bright">               @ @                   </tspan>
      </text>
    </g>

    <!-- Bottom Command Prompt Box -->
    <rect x="25" y="408" width="380" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="38" y="430" class="mono" font-size="11" fill="#0284C7">~/profile $ <tspan fill="#0F172A">build --ship --production</tspan></text>
    <text x="38" y="450" class="mono muted" font-size="11">[LOG] Architecting ERP &amp; POS Platforms...</text>
    <text x="38" y="470" class="mono" font-size="11" fill="#059669">&gt; STATUS: OK <tspan fill="#0284C7">[ 200 OK ]</tspan> <tspan fill="#059669">_</tspan></text>
  </g>

  <!-- ================= 4. RIGHT PANEL — SYSTEM.INFO (680px / 62% width) ================= -->
  <g transform="translate(476, 76)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.25s" dur="0.5s" fill="freeze"/>

    <!-- Right Glass Panel Container -->
    <rect x="0" y="0" width="680" height="508" rx="16" fill="url(#glassPanel)" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="0" y="0" width="680" height="508" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Right Panel Header -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 664 0 A 16 16 0 0 1 680 16 L 680 38 L 0 38 Z" fill="#F1F5F9" fill-opacity="0.8"/>
    <text x="20" y="24" class="mono section-head">SYSTEM.INFO // EXECUTIVE MATRIX</text>
    <text x="540" y="24" class="mono muted" font-size="11">user@developer:~$ ./profile.sh</text>
    <line x1="0" y1="38" x2="680" y2="38" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Identity Header Section -->
    <g transform="translate(24, 55)">
      <!-- Name -->
      <text x="0" y="28" class="sans name-text">Adarsh B A</text>
      
      <!-- SMIL Continuous Animated Role Rotation -->
      <rect x="0" y="38" width="460" height="24" rx="6" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-opacity="0.3"/>
      <text x="12" y="54" class="mono" font-size="11" font-weight="700" fill="#0284C7">
        <tspan>FULL-STACK ENGINEER</tspan>
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.97;0.99;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="12" y="54" class="mono" font-size="11" font-weight="700" fill="#059669" opacity="0">
        <tspan>SYSTEMS ARCHITECT</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.30;0.35;0.61;0.66;0.94;0.97;0.99;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="12" y="54" class="mono" font-size="11" font-weight="700" fill="#6D28D9" opacity="0">
        <tspan>SAAS BUILDER &amp; CEO @ ROOTNODE REBELS</tspan>
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.30;0.35;0.63;0.68;0.94;0.97;0.99;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="445" y="54" class="mono" font-size="12" font-weight="700" fill="#0284C7">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>_
      </text>

      <!-- Sub-headline -->
      <text x="0" y="86" class="sans muted" font-size="12.5">
        Founder &amp; CEO @ <tspan fill="#0F172A" font-weight="600">RootNode Rebels</tspan> &nbsp;·&nbsp; B.E. Computer Engineering @ <tspan fill="#0F172A" font-weight="600">BIET</tspan>
      </text>
    </g>

    <!-- Horizontal Divider Line -->
    <line x1="24" y1="165" x2="656" y2="165" stroke="#CBD5E1" stroke-dasharray="4 4"/>

    <!-- Balanced Label-Value Grid -->
    <g transform="translate(24, 180)">
      <!-- Row 1: Focus -->
      <text x="75" y="16" class="mono label-col">FOCUS</text>
      <text x="95" y="16" class="sans val-col">ERP Systems &nbsp;·&nbsp; POS Platforms &nbsp;·&nbsp; Modular REST APIs &nbsp;·&nbsp; Cloud DevOps</text>

      <!-- Row 2: Academics -->
      <text x="75" y="40" class="mono label-col">ACADEMICS</text>
      <text x="95" y="40" class="sans val-col">B.E. Computer Science &amp; Engineering — BIET Davanagere</text>

      <!-- Row 3: Motto -->
      <text x="75" y="64" class="mono label-col">MOTTO</text>
      <text x="95" y="64" class="sans muted" font-style="italic">"Engineering solutions that are scalable, secure, and architecturally sound."</text>
    </g>

    <!-- Horizontal Divider Line -->
    <line x1="24" y1="265" x2="656" y2="265" stroke="#CBD5E1" stroke-dasharray="4 4"/>

    <!-- Tech Stack Pills Grid -->
    <g transform="translate(24, 280)">
      <text x="0" y="14" class="mono section-head">CORE.STACK // DOMAINS</text>
      
      <g transform="translate(0, 26)">
        <!-- TS / JS -->
        <rect x="0" y="0" width="102" height="28" rx="8" fill="url(#pillGrad)" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#3178C6"/>
        <text x="25" y="18" class="mono bright" font-size="11">TypeScript</text>

        <!-- React / Next -->
        <rect x="112" y="0" width="96" height="28" rx="8" fill="url(#pillGrad)" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="126" cy="14" r="3" fill="#0284C7"/>
        <text x="137" y="18" class="mono bright" font-size="11">React / Next</text>

        <!-- Node.js -->
        <rect x="218" y="0" width="82" height="28" rx="8" fill="url(#pillGrad)" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="232" cy="14" r="3" fill="#059669"/>
        <text x="243" y="18" class="mono bright" font-size="11">Node.js</text>

        <!-- Python -->
        <rect x="310" y="0" width="82" height="28" rx="8" fill="url(#pillGrad)" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="324" cy="14" r="3" fill="#2563EB"/>
        <text x="335" y="18" class="mono bright" font-size="11">Python</text>

        <!-- PostgreSQL -->
        <rect x="402" y="0" width="102" height="28" rx="8" fill="url(#pillGrad)" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="416" cy="14" r="3" fill="#2563EB"/>
        <text x="427" y="18" class="mono bright" font-size="11">PostgreSQL</text>

        <!-- Docker -->
        <rect x="514" y="0" width="82" height="28" rx="8" fill="url(#pillGrad)" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="528" cy="14" r="3" fill="#0284C7"/>
        <text x="539" y="18" class="mono bright" font-size="11">Docker</text>
      </g>
    </g>

    <!-- Deployed Systems Showcase Cards -->
    <g transform="translate(24, 360)">
      <text x="0" y="14" class="mono section-head">DEPLOYED.SYSTEMS // PRODUCTION</text>
      
      <g transform="translate(0, 26)">
        <!-- Project 1 Card -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="305" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
          <text x="14" y="22" class="sans bright" font-size="12.5">Sri Basaveswara School ERP</text>
          <text x="14" y="40" class="sans muted" font-size="11">Student pipelines &amp; ledger dashboards</text>
          <rect x="238" y="10" width="56" height="18" rx="4" fill="#059669" fill-opacity="0.15"/>
          <text x="246" y="23" class="mono" font-size="10" font-weight="700" fill="#059669">LIVE ↗</text>
        </g>

        <!-- Project 2 Card -->
        <g transform="translate(325, 0)">
          <rect x="0" y="0" width="307" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
          <text x="14" y="22" class="sans bright" font-size="12.5">SuperPOS Pro (Smart Trolley)</text>
          <text x="14" y="40" class="sans muted" font-size="11">POS &amp; UPI checkout inventory system</text>
          <rect x="240" y="10" width="56" height="18" rx="4" fill="#059669" fill-opacity="0.15"/>
          <text x="248" y="23" class="mono" font-size="10" font-weight="700" fill="#059669">LIVE ↗</text>
        </g>
      </g>
    </g>

    <!-- Bottom Contact Links -->
    <g transform="translate(24, 460)">
      <line x1="0" y1="0" x2="632" y2="0" stroke="#CBD5E1" stroke-width="1"/>
      <text x="0" y="22" class="mono muted" font-size="11">
        PORTFOLIO: <tspan fill="#0284C7">adhi.is-a.dev</tspan> &nbsp;·&nbsp; 
        LINKEDIN: <tspan fill="#0284C7">in/developeradhi</tspan> &nbsp;·&nbsp; 
        EMAIL: <tspan fill="#0284C7">contact@adhi.is-a.dev</tspan>
      </text>
    </g>
  </g>
</svg>
